monitor=HDMI-A-2,preferred,0x0,1
monitor=HDMI-A-1,preferred,1920x0,1

$terminal = kitty
$fileManager = dolphin
$menu = GTK_LAYER_SHELL=0 wofi --show drun

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = GTK_THEME,Adwaita:dark

input {
    kb_layout = de
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}

general {
    gaps_in = 5
    gaps_out = 5
    border_size = 2
    col.active_border = rgba(ffffffff) rgba(ffffffff) 45deg
    col.inactive_border = rgba(00000000)
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 5
    rounding_power = 2
    active_opacity = 1
    inactive_opacity = .98

    shadow {
        enabled = false
    }

    blur {
        enabled = false
    }
}

animations {
    enabled = true

    bezier = smoothOut, 0.25, 0.9, 0.35, 1.0
    bezier = smoothInOut, 0.4, 0.0, 0.2, 1.0
    bezier = subtle, 0.22, 0.9, 0.3, 1.0
    bezier = stylish, 0.2, 1.0, 0.15, 1.0

    animation = windows, 1, 6, stylish, popin 96%
    animation = windowsOut, 1, 5, smoothInOut, popin 96%
    animation = border, 1, 9, subtle
    animation = fade, 1, 5, smoothInOut
    animation = layersIn, 1, 5, subtle, slide bottom
    animation = layersOut, 1, 4, smoothInOut, slide bottom
    animation = fadeLayersIn, 1, 4, subtle
    animation = fadeLayersOut, 1, 4, smoothInOut
    animation = workspaces, 1, 6, stylish, slide
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

group {
    col.border_active = rgba(ffffffff)
    col.border_inactive = rgba(ffffff66)
    col.border_locked_active = rgba(ffffffff)
    col.border_locked_inactive = rgba(ffffff66)

    groupbar {
        text_color = rgba(ffffffff)
        col.active = rgba(ffffffff)
        col.inactive = rgba(ffffff66)
        col.locked_active = rgba(ffffffff)
        col.locked_inactive = rgba(ffffff66)
    }
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = false
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

$mainMod = SUPER

bind = $mainMod, S, exec, hyprshot -m region
bind = $mainMod, V, exec, ~/.local/bin/screenrecord-toggle.sh
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, D, exec, rofi -show drun
bind = $mainMod, Q, killactive
bind = $mainMod SHIFT, Q, exit

bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r

bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, L, movewindow, r

bind = $mainMod, T, togglegroup
bind = $mainMod, Tab, changegroupactive, f
bind = $mainMod SHIFT, Tab, changegroupactive, b
bind = $mainMod SHIFT, T, moveoutofgroup

bind = $mainMod, F, togglefloating
bind = $mainMod, R, exec, hyprctl reload
bind = $mainMod SHIFT, R, exec, $HOME/.config/hypr/set-wallpaper.sh

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, E, submap, resize
submap = resize
bind = , H, resizeactive, -30 0
bind = , L, resizeactive, 30 0
bind = , K, resizeactive, 0 -30
bind = , J, resizeactive, 0 30
bind = $mainMod, R, submap, reset
bind = , Escape, submap, reset
bind = , Return, submap, reset
submap = reset

bind = $mainMod, Z, exec, woomer

windowrule = match:class ^(origo)$, workspace 4

windowrule = match:class ^(kitty)$, opacity 0.90 0.98

windowrule = match:title ^(unmanaged)$, move 5 50
windowrule = match:title ^(unmanaged)$, size 1900 1000
windowrule = match:title ^(unmanaged)$, float on

windowrule = match:class ^(Godot)$, tile on
windowrule = match:class .*, suppress_event maximize

exec-once = waybar -c ~/.config/waybar/config.json -s ~/.config/waybar/style.css &
exec-once = $HOME/.config/hypr/set-wallpaper.sh
exec-once = mako
